name: Verify PrintEase
on:
  push:
    branches: [kotlin-native]
  pull_request:
concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDemoDebugUnitTest :app:lintDemoDebug :app:assembleDemoDebug :app:assembleLiveDebug :app:assembleDemoDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-and-demo
          path: |
            app/build/reports/
            app/build/screenshots/
            app/build/outputs/apk/demo/debug/
  firebase-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix web-app
      - run: npm ci --prefix functions
      - run: npm audit --omit=dev --audit-level=high --prefix web-app
      - run: npm audit --omit=dev --audit-level=high --prefix functions
      - run: npm test --prefix web-app
      - run: npm run build --prefix web-app
      - run: npm test --prefix functions
      - run: npx firebase emulators:exec --only auth,firestore,storage --project demo-printease 'node --test firebase/rules.test.cjs && node --test web-app/tests/cloud.integration.mjs'
